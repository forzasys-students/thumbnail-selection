<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyframe Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/results.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/thumbnail_editor.css') }}">
</head>
<body>
    <div class="header">
        <h1>Thumbnail Candidates</h1>
        <p>Review and select the best frames for your video thumbnails</p>
    </div>

    
    <div class="container">
        <div class="controls">
            <div class="count-badge">
                {% if keyframes %}
                    {{ keyframes|length }} keyframe{{ 's' if keyframes|length != 1 else '' }} found
                {% else %}
                    No keyframes found
                {% endif %}
            </div>

            <div class="filter-panel">
                <label>
                    Sort By
                    <select id="sortBy">
                        <option value="final_score">Final Score</option>
                        <option value="w_iqa">IQA</option>
                        <option value="w_face">Face</option>
                        <option value="w_emotion">Emotion</option>
                        <option value="w_pose">Pose</option>
                    </select>
                </label>
            </div>

            
            <div class="button-group">
                <div class="view-toggle">
                    <button class="view-btn active" onclick="setView('grid')">Grid</button>
                    <button class="view-btn" onclick="setView('list')">List</button>
                </div>
                
                <button class="btn-primary" onclick="window.location.href='{{ url_for('index') }}'">Process New Video</button>
            </div>
        </div>
        
        <div class="gallery" id="gallery"></div>

    </div>
    
    <!-- Modal for image preview -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <button class="modal-nav modal-prev" onclick="event.stopPropagation(); changeImage(-1)">◄</button>
        <div class="modal-content">
            <img class="modal-image" id="modalImage" src="" alt="">
        </div>
        <button class="modal-nav modal-next" onclick="event.stopPropagation(); changeImage(1)">►</button>
        <div class="modal-info" id="modalInfo"></div>
    </div>

    <script>
        const keyframes = {{ keyframe_data|tojson }};
        const images = {{ keyframes|tojson }};  // Simple array of filenames for backward compatibility
    </script>
    <script src="{{ url_for('static', filename='js/results.js') }}"></script>
    <script src="{{ url_for('static', filename='js/thumbnail_editor.js') }}"></script>
</body>
</html>
