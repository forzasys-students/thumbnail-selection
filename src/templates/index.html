<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thumbnail Selection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
    <div class="container">
        <h1>Thumbnail Selection</h1>
        <p class="subtitle">Upload a video and select a model to extract key frames for thumbnails</p>
        
        <div class="info-box">
            <strong>How it works:</strong><br>
            The system will analyze your video, run inference, and extract the most important frames for thumbnails.
        </div>
        
        <form method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="model">Select Model:</label>
                <select name="model" id="model" required>
                    <option value="resnet18">ResNet-18</option>
                    <option value="resnet50">ResNet-50</option>
                    <option value="efficientnet">EfficientNet</option>
                    <option value="convnext">ConvNeXt</option>
                    <option value="vit">Vision Transformer</option>
                </select>
            </div>

            <div class="form-group">
                <label>Upload Video:</label>

                <input type="file"
                    name="video"
                    id="video"
                    accept=".mp4,.avi,.mov"
                    hidden
                    required>

                <label for="video" class="file-btn" id="fileLabel">
                    📁 Choose Video File
                </label>
            </div>


            <button type="submit">Start Processing</button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
